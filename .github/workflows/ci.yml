name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Gitleaks (full history, findings redacted)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          (cd "$RUNNER_TEMP" && sha256sum --check --strict "$GITHUB_WORKSPACE/ci/gitleaks.sha256")
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner

      - name: Syntax
        run: ci/check-syntax.sh

      - name: Unit tests (fictional data only)
        env:
          NO_PUSH: "1"
        run: |
          node test-db.mjs
          node test-import.mjs
          node test-labs.mjs
          node test-mailer.mjs
          node test-auth.mjs
          node test-passkeys.mjs
          node test-households.mjs
          node test-ingest-push.mjs
          node test-members.mjs
          node test-medicines.mjs
          node test-push.mjs
          node test-appointments.mjs
          node test-access.mjs
          node test-ahparse.mjs
          node test-preview.mjs
          python3 test-build-index.py

      - name: Server end-to-end (preview seed)
        run: node test-server.mjs

      - name: Browser smoke and accounts tests (Chrome, 390x844)
        env:
          CHROME_BIN: google-chrome
        run: node test-browser-smoke.mjs && node test-browser-accounts.mjs
